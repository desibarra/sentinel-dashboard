[[redirects]]
  from = "/"
  to = "/sentinel-express-landing.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://sentinel.wibby.cloud/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  PNPM_FLAGS = "--no-frozen-lockfile"
  NODE_VERSION = "20"
  VITE_API_URL = ""